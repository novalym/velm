# Path: rust/Cargo.toml
# ---------------------

[package]
name = "scaffold_core_rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "scaffold_core_rs"
crate-type = ["cdylib"]

[[bin]]
name = "scaffold"
path = "src/bin/scaffold.rs"

[dependencies]
pyo3 = { version = "0.21.0", features = ["extension-module", "abi3-py39"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ignore = "0.4"
walkdir = "2.3"
sha2 = "0.10"
hex = "0.4"
memmap2 = "0.9"
memchr = "2.7"
encoding_rs = "0.8"
rayon = "1.10"
regex = "1.10.0"
lazy_static = "1.4.0"
base64 = "0.21.5"
uuid = { version = "1.8", features =["v4", "fast-rng"] }
chrono = "0.4"

#[THE MASTER CURE]: The Schism of Tongues is Healed.
tree-sitter = "=0.20.10"
tree-sitter-python = "=0.20.4"
tree-sitter-javascript = "=0.20.1"
tree-sitter-typescript = "=0.20.2"
tree-sitter-go = "=0.20.0"
tree-sitter-rust = "=0.20.4"
tree-sitter-ruby = "=0.20.0"
tree-sitter-cpp = "=0.20.0"
tree-sitter-java = "=0.20.0"
tree-sitter-html = "=0.20.0"
tree-sitter-css = "=0.20.0"
hasher = "0.1.4"
